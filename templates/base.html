<!DOCTYPE html>
<html>
<head>
    <title>AI Summarizer</title>
</head>
<body>

<nav>

    {% if user.is_authenticated %}

        <p>
            Welcome {{ user.username }}
        </p>

        <a href="{% url 'logout' %}">
            Logout
        </a>

    {% else %}

        <a href="{% url 'login' %}">
            Login
        </a>

        <a href="{% url 'register' %}">
            Register
        </a>

    {% endif %}

    <hr>

</nav>

{% block content %}
{% endblock %}

</body>
</html>
